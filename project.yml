name: SidecarBridge
options:
  bundleIdPrefix: io.sidecarbridge
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    # App Store Connect requires the build number to increase across uploads.
    # macOS 1.3 upload: build 105. Keep this sequence independent from iPadOS.
    CURRENT_PROJECT_VERSION: "105"
    DEVELOPMENT_TEAM: LYK4LV2859
targets:
  SidecarBridgeMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: SidecarBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge advertises an encrypted local display service and accepts an incoming connection from the iPhone or iPad you select.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.mac
        PRODUCT_NAME: SidecarBridge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Mac/SidecarBridgeMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Accessibility/TCC must identify the real app executable, not Xcode's
        # debug-dylib launcher arrangement.
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: ServiceManagement.framework
      - sdk: Network.framework
      - sdk: VideoToolbox.framework
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
      - sdk: Carbon.framework

  SidecarBridgePad:
    type: application
    platform: iOS
    sources:
      - Shared
      - Pad
    info:
      path: Pad/Info.plist
      properties:
        CFBundleDisplayName: SidecarBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices:
          - _sb-screen._tcp
          - _sb-direct._tcp
        NSLocalNetworkUsageDescription: SidecarBridge finds your Mac and receives its screen over your local network.
        NSCameraUsageDescription: Scan the temporary pairing QR code displayed by SidecarBridge on your Mac. Images are not saved or uploaded.
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneClassName: UIWindowScene
                UISceneConfigurationName: Default Configuration
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.mac
        PRODUCT_NAME: SidecarBridge
        MARKETING_VERSION: "1.3"
        # iPadOS 1.3 upload: build 30. Keep this sequence independent from macOS.
        CURRENT_PROJECT_VERSION: "30"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: MultipeerConnectivity.framework
      - sdk: Network.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: VisionKit.framework
      - sdk: Security.framework

  SidecarBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Pad/MacScreenSharingSession.swift
      - Mac/SidecarConnector.swift
      - Mac/PairingQRCodeView.swift
      - Mac/MacPairingCard.swift
      - Mac/MacDeviceAuthorization.swift
      - Pad/RemoteKeyboardToolbar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sidecarbridge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: Security.framework

schemes:
  SidecarBridgeMac:
    build:
      targets:
        SidecarBridgeMac: all
        SidecarBridgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SidecarBridgeTests
  SidecarBridgePad:
    build:
      targets:
        SidecarBridgePad: all
    run:
      config: Debug
